name: MusicApp-Database CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'musicapp-db/migrations/**'
      - 'musicapp-db/schema/**'

jobs:
  migrate:
    name: Run Flyway Migrations
    runs-on: self-hosted

    env:
      FLYWAY_URL: ${{ github.ref_name == 'main' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV}}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate database and migrations
        uses: docker://flyway/flyway:11
        with:
          args: >-
            -url=${{ env.FLYWAY_URL }} 
            -user=${{ secrets.FLYWAY_USER }} 
            -password=${{ secrets.FLYWAY_PASSWORD }} 
            -locations=filesystem:/github/workspace/musicapp-db/migrations validate

      - name: Code review migrations
        if: always()
        uses: docker://flyway/flyway:11
        with:
          args: >-
            -url=${{ env.FLYWAY_URL }} 
            -user=${{ secrets.FLYWAY_USER }} 
            -password=${{ secrets.FLYWAY_PASSWORD }} 
            -locations=filesystem:/github/workspace/musicapp-db/migrations check -code