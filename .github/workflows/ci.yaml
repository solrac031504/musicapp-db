name: MusicApp-Database CI

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'musicapp-db/migrations/**'
      - 'musicapp-db/schema/**'
      - 'musicapp-db/etl/**'
    types:
      - opened
      - synchronize
      - reopened

jobs:
  db-validation:
    name: musicapp-db-validation
    runs-on: self-hosted

    env:
      FLYWAY_URL: ${{ github.ref_name == 'main' && secrets.FLYWAY_URL_PROD || secrets.FLYWAY_URL_DEV}}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Display current migration info
        uses: docker://flyway/flyway:11
        with:
          args: >-
            -url=${{ env.FLYWAY_URL }} 
            -user=${{ secrets.FLYWAY_USER }} 
            -password=${{ secrets.FLYWAY_PASSWORD }} 
            -locations=filesystem:/github/workspace/musicapp-db/migrations info

      - name: Validate database and migrations
        uses: docker://flyway/flyway:11
        with:
          args: >-
            -url=${{ env.FLYWAY_URL }} 
            -user=${{ secrets.FLYWAY_USER }} 
            -password=${{ secrets.FLYWAY_PASSWORD }} 
            -locations=filesystem:/github/workspace/musicapp-db/migrations validate -ignoreMigrationPatterns="*:pending"

  python-validation:
    name: musicapp-etl-validation
    runs-on: self-hostedj
    defaults:
      run:
        working-directory: musicapp-db

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.x'

      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate

      - name: Install dependencies
        run: |
          pip install -r etl/requirements.txt
          pip install flake8 pyright

      - name: Lint with flake8
        run: |
          flake8 musicapp-db/etl/ \
            --max-line-length=120 \
            --ignore=E501

      - name: Type-check with pyright
        run: |
          pyright etl/